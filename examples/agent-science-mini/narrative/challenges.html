<div class="two-col">
<div><h3>开放挑战</h3><ol class="nice">
<li><b>验证跟不上生成</b>：生成假设和论文已经很便宜，独立验证（复现、湿实验、证明检查）却很昂贵。</li>
<li><b>新颖性与重要性评估</b>：LLM 想法“看起来新颖”，执行后效果打折扣。</li>
<li><b>可复现性与科研诚信</b>：数据泄露、选择性报告、引用幻觉。</li>
<li><b>评测体系</b>：多数基准衡量“复现”而非“发现”，存在污染与饱和问题。</li>
</ol></div>
<div><h3>未来趋势</h3><ol class="nice">
<li><b>从“写论文”转向“做出经过验证的发现”</b>：实验室在环与可追溯推理。</li>
<li><b>可自动验证的领域率先突破</b>：算法、数学、ML/系统优化。</li>
</ol></div>
</div>
